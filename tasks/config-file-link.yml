---
# Debian packaging layout: /etc/mysql/my.cnf is a symlink to mariadb.cnf,
# which includes conf.d/ and mariadb.conf.d/.
#
# Included from config-file.yml when mysql_config_file_link_to_mariadb_cnf is true.
#   1. mariadb.cnf missing  -> restored with the Debian default content (never overwritten otherwise)
#   2. my.cnf is a regular file -> backed up (mysql_config_file_link_backup) then replaced
#   3. my.cnf is a link that does not end on mariadb.cnf -> repointed
# A link that already ends on mariadb.cnf is left alone, so the Debian alternatives layout
# (my.cnf -> /etc/alternatives/my.cnf -> mariadb.cnf) is accepted as is.

- name: Check that the MariaDB layout can be used.
  ansible.builtin.assert:
    that:
      - mysql_daemon is search('mariadb')
      - (mysql_config_mariadb_cnf | dirname) == (mysql_config_file | dirname)
    fail_msg: >-
      The my.cnf link only applies to MariaDB, and mariadb.cnf ({{ mysql_config_mariadb_cnf }})
      must sit in the same directory as {{ mysql_config_file }}.
      Set mysql_config_file_link_to_mariadb_cnf to false on this host.
    quiet: true

# force=false: the file is created only when it is absent.
- name: Restore the default mariadb.cnf when it is missing.
  ansible.builtin.template:
    src: mariadb.cnf.j2
    dest: "{{ mysql_config_mariadb_cnf }}"
    owner: root
    group: root
    mode: 0644
    force: false
  notify: restart mysql

- name: Stat mariadb.cnf.
  ansible.builtin.stat:
    path: "{{ mysql_config_mariadb_cnf }}"
  register: mysql_mariadb_cnf_stat

- name: Stat my.cnf without following links.
  ansible.builtin.stat:
    path: "{{ mysql_config_file }}"
    follow: false
  register: mysql_my_cnf_stat

- name: Stat my.cnf following links.
  ansible.builtin.stat:
    path: "{{ mysql_config_file }}"
    follow: true
  register: mysql_my_cnf_target_stat

- name: Check that my.cnf is not a directory.
  ansible.builtin.assert:
    that: not (mysql_my_cnf_stat.stat.isdir | default(false))
    fail_msg: "{{ mysql_config_file }} is a directory, refusing to replace it by a link."
    quiet: true

# Same inode as mariadb.cnf, reached through a link: whatever the number of hops.
- name: Check where my.cnf leads.
  ansible.builtin.set_fact:
    mysql_my_cnf_leads_to_mariadb_cnf: >-
      {{ (mysql_my_cnf_stat.stat.islnk | default(false))
         and (mysql_my_cnf_target_stat.stat.exists | default(false))
         and (mysql_mariadb_cnf_stat.stat.exists | default(false))
         and (mysql_my_cnf_target_stat.stat.inode | default(0)) == (mysql_mariadb_cnf_stat.stat.inode | default(-1)) }}

- name: Back up my.cnf before replacing it by the link.
  ansible.builtin.copy:
    src: "{{ mysql_config_file }}"
    dest: "{{ mysql_config_file }}.bak-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
    remote_src: true
    owner: root
    group: root
    mode: 0600
  when:
    - mysql_config_file_link_backup | bool
    - mysql_my_cnf_stat.stat.isreg | default(false)

- name: Make my.cnf a symbolic link to mariadb.cnf.
  ansible.builtin.file:
    src: "{{ mysql_config_mariadb_cnf | basename }}"
    dest: "{{ mysql_config_file }}"
    state: link
    force: true
  when: not (mysql_my_cnf_leads_to_mariadb_cnf | bool)
  notify: restart mysql
