---
# Fail early, before any change, when the package includes cannot work on this host.
- name: Check the MariaDB package includes can be managed on this host.
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - mysql_daemon is search('mariadb')
      - mysql_config_mariadb_include_dir is defined
      - mysql_config_file_link_to_mariadb_cnf | bool or mysql_skip_mycnf_management | bool
    fail_msg: >-
      mysql_mariadb_includes_manage needs Debian with MariaDB, and a my.cnf that reaches
      mariadb.conf.d: my.cnf linked to mariadb.cnf (mysql_config_file_link_to_mariadb_cnf)
      or left untouched (mysql_skip_mycnf_management). The my.cnf.j2 template does not
      include mariadb.conf.d.
    quiet: true
  when: mysql_mariadb_includes_manage | bool

- name: Get MySQL version
  block:
    - name: Run mysql --version
      ansible.builtin.command: '{{ mysql_daemon }} --version'
      register: mysql_cli_version
      changed_when: false
      check_mode: false

    - name: Extract MySQL version
      ansible.builtin.set_fact:
        mysql_cli_version: >-
          {{ mysql_cli_version.stdout | regex_search('\d+\.\d+\.\d+(-[a-zA-Z]+)?') }}

# my.cnf: skipped, linked to mariadb.cnf, rendered from my.cnf.j2, or ignored.
# The decision tree is documented in defaults/main.yml.
- name: Handle my.cnf.
  ansible.builtin.include_tasks: config-file.yml

# Include files: those of the MariaDB package (optional) and the project's own.
# The merge rules are documented in includes.yml.
- name: Deploy the include files.
  ansible.builtin.include_tasks: includes.yml

- name: Create datadir if it does not exist
  ansible.builtin.file:
    path: "{{ mysql_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: 0755
    setype: mysqld_db_t

- name: Ensure error log directory exists
  ansible.builtin.file:
    path: "{{ mysql_log_error | dirname }}"
    state: directory
    owner: mysql
    group: "{{ mysql_log_file_group }}"
    mode: "{{ mysql_log_dir_mode }}"
  when:
    - mysql_log_error | default('') | length > 0
    - mysql_log_error != 'syslog'

- name: Ensure slow query log file exists and has correct permissions
  ansible.builtin.file:
    path: "{{ mysql_slow_query_log_file }}"
    state: touch
    owner: mysql
    group: "{{ mysql_log_file_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when: mysql_slow_query_log_enabled | bool

- name: Ensure error log file exists and has correct permissions
  ansible.builtin.file:
    path: "{{ mysql_log_error }}"
    state: touch
    owner: mysql
    group: "{{ mysql_log_file_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when:
    - mysql_log | default('') | length > 0
    - mysql_log_error | default('') | length > 0
    - mysql_log_error != 'syslog'
  tags: ['skip_ansible_galaxy']

- name: Ensure MySQL is started and enabled on boot.
  ansible.builtin.service:
    name: "{{ mysql_daemon }}"
    state: started
    enabled: "{{ mysql_enabled_on_startup }}"
  register: mysql_service_configuration
