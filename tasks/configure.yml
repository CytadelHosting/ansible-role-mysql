---
- name: Get MySQL version
  block:
    - name: Run mysql --version
      ansible.builtin.command: '{{ mysql_daemon }} --version'
      register: mysql_cli_version
      changed_when: false
      check_mode: false

    - name: Extract MySQL version
      ansible.builtin.set_fact:
        mysql_cli_version: >-
          {{ mysql_cli_version.stdout | regex_search('\d+\.\d+\.\d+(-[a-zA-Z]+)?') }}

# my.cnf: skipped, linked to mariadb.cnf, rendered from my.cnf.j2, or ignored.
# The decision tree is documented in defaults/main.yml.
- name: Handle my.cnf.
  ansible.builtin.include_tasks: config-file.yml

# Each entry lands in one directory, under one filename.
# dest_dir omitted or "conf.d" uses mysql_config_include_dir.
# "mariadb.conf.d" uses mysql_config_mariadb_include_dir (Debian/Arch).
# Any other absolute path is used as-is.
# dest_name defaults to the source basename without a trailing .j2.
# type "template" renders Jinja (historical behaviour). type "file" copies bytes.
- name: Check mysql include entries.
  ansible.builtin.assert:
    that:
      - item.src is defined
      - item.src | length > 0
      - item.type | default('template') in ['template', 'file']
      - item.dest_name is not defined or '/' not in item.dest_name
      - item.dest_dir is not defined or item.dest_dir in ['conf.d', 'mariadb.conf.d'] or item.dest_dir is match('^/')
    fail_msg: >-
      mysql_config_include_files entry is invalid (src={{ item.src | default('') }}).
      type is template or file, dest_dir is conf.d, mariadb.conf.d or an absolute path,
      dest_name is a filename.
    quiet: true
  loop: "{{ mysql_config_include_files }}"
  loop_control:
    label: "{{ item.src | default('missing src') }}"
  when: mysql_config_include_files | length > 0

- name: Check mariadb.conf.d is available on this OS.
  ansible.builtin.assert:
    that:
      - mysql_config_mariadb_include_dir is defined
      - mysql_config_mariadb_include_dir | length > 0
    fail_msg: >-
      dest_dir mariadb.conf.d is not defined for this OS.
      Set mysql_config_mariadb_include_dir or pass an absolute dest_dir.
    quiet: true
  when:
    - mysql_config_include_files | length > 0
    - mysql_config_include_files | selectattr('dest_dir', 'defined') | selectattr('dest_dir', 'equalto', 'mariadb.conf.d') | list | length > 0

- name: Reset resolved mysql include files.
  ansible.builtin.set_fact:
    mysql_config_include_files_resolved: []

- name: Resolve mysql include destinations.
  ansible.builtin.set_fact:
    mysql_config_include_files_resolved: "{{ mysql_config_include_files_resolved + [mysql_include_resolved] }}"
  loop: "{{ mysql_config_include_files }}"
  loop_control:
    loop_var: mysql_include_item
    label: "{{ mysql_include_item.src }}"
  vars:
    mysql_include_dest_dir: "{{ mysql_config_mariadb_include_dir if (mysql_include_item.dest_dir | default('conf.d')) == 'mariadb.conf.d' else (mysql_config_include_dir if (mysql_include_item.dest_dir | default('conf.d')) in ['conf.d'] else mysql_include_item.dest_dir) }}"
    mysql_include_dest_name: "{{ mysql_include_item.dest_name | default(mysql_include_item.src | basename | regex_replace('\\.j2$', '')) }}"
    mysql_include_resolved:
      src: "{{ mysql_include_item.src }}"
      type: "{{ mysql_include_item.type | default('template') }}"
      dest: "{{ mysql_include_dest_dir | regex_replace('/$', '') }}/{{ mysql_include_dest_name }}"
      force: "{{ mysql_include_item.force | default(false) | bool }}"
  when: mysql_config_include_files | length > 0

- name: Create mysql include directories.
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop: "{{ mysql_config_include_files_resolved }}"
  loop_control:
    label: "{{ item.dest | dirname }}"

- name: Deploy mysql include templates.
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: 0644
    force: "{{ item.force | bool }}"
  loop: "{{ mysql_config_include_files_resolved }}"
  loop_control:
    label: "{{ item.dest }}"
  when: item.type == 'template'
  notify: restart mysql

- name: Deploy mysql include files.
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: 0644
    force: "{{ item.force | bool }}"
  loop: "{{ mysql_config_include_files_resolved }}"
  loop_control:
    label: "{{ item.dest }}"
  when: item.type == 'file'
  notify: restart mysql

- name: Create datadir if it does not exist
  ansible.builtin.file:
    path: "{{ mysql_datadir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: 0755
    setype: mysqld_db_t

- name: Ensure error log directory exists
  ansible.builtin.file:
    path: "{{ mysql_log_error | dirname }}"
    state: directory
    owner: mysql
    group: "{{ mysql_log_file_group }}"
    mode: "{{ mysql_log_dir_mode }}"
  when:
    - mysql_log_error | default('') | length > 0
    - mysql_log_error != 'syslog'

- name: Ensure slow query log file exists and has correct permissions
  ansible.builtin.file:
    path: "{{ mysql_slow_query_log_file }}"
    state: touch
    owner: mysql
    group: "{{ mysql_log_file_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when: mysql_slow_query_log_enabled | bool

- name: Ensure error log file exists and has correct permissions
  ansible.builtin.file:
    path: "{{ mysql_log_error }}"
    state: touch
    owner: mysql
    group: "{{ mysql_log_file_group }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  when:
    - mysql_log | default('') | length > 0
    - mysql_log_error | default('') | length > 0
    - mysql_log_error != 'syslog'
  tags: ['skip_ansible_galaxy']

- name: Ensure MySQL is started and enabled on boot.
  ansible.builtin.service:
    name: "{{ mysql_daemon }}"
    state: started
    enabled: "{{ mysql_enabled_on_startup }}"
  register: mysql_service_configuration
