---
# Set this to the user ansible is logging in as - should have root
# or sudo access
mysql_user_home: /root
mysql_user_name: root
mysql_user_password: root

# The default root user installed by mysql - almost always root
mysql_root_home: /root
mysql_root_username: root
mysql_root_password: root

# Set this to `true` to forcibly update the root password.
mysql_root_password_update: false
mysql_user_password_update: false

# null = upstream behavior: secure-install when packages are installed
# or when mysql_root_password_update is true.
# false = do not touch root auth, /root/.my.cnf, anonymous users or the test database,
# including after a package upgrade.
mysql_secure_installation: ~

mysql_enabled_on_startup: true

# Whether my.cnf should be updated on every run.
overwrite_global_mycnf: true

# --- Ownership of my.cnf (decision tree, evaluated in tasks/config-file.yml) ---
#
#   mysql_skip_mycnf_management = true   -> my.cnf is left exactly as it is, nothing else is checked
#   otherwise
#     link = true  (Debian + MariaDB)    -> my.cnf must be a symlink to mariadb.cnf:
#                                           a missing mariadb.cnf is restored (Debian default content),
#                                           a my.cnf that is not that link is backed up, then replaced by it
#     link = false
#       manage = true  (historical)      -> my.cnf is rendered from my.cnf.j2
#       manage = false                   -> nothing (my.cnf is not managed)
#   In every case, mysql_config_include_files are deployed afterwards.
#
# With a link, the global settings of my.cnf.j2 (mysql_max_connections, ...) are NOT deployed:
# put them in mysql_config_include_files (typically mariadb.conf.d/90-*.cnf).
mysql_skip_mycnf_management: false

# true by default on Debian-family hosts running MariaDB, where the package ships
# /etc/mysql/my.cnf as a link to mariadb.cnf (which includes conf.d/ and mariadb.conf.d/).
# Set it to false to keep rendering my.cnf from my.cnf.j2 on such a host.
mysql_config_file_link_to_mariadb_cnf: "{{ (mysql_daemon | default('')) is search('mariadb') and ansible_facts['os_family'] == 'Debian' }}"

# Only read when the link is disabled: false = do not write my.cnf at all.
mysql_config_file_manage: true

# Keep a copy of a my.cnf that is about to be replaced by the link (name: my.cnf.bak-<date>).
mysql_config_file_link_backup: true

# The file my.cnf must link to; must be in the same directory as my.cnf.
mysql_config_mariadb_cnf: "{{ mysql_config_file | dirname }}/mariadb.cnf"

# The following variables have a default value depending on operating system.
# mysql_config_file: /etc/my.cnf
# mysql_config_include_dir: /etc/my.cnf.d

# Whether to copy root user's config file with credentials to their homedir
mysql_copy_root_user_mycnf: true

# Pass in a comma-separated list of repos to use (e.g. "remi,epel"). Used only
# for RedHat systems (and derivatives).
mysql_enablerepo: ""

# Define a custom list of packages to install; if none provided, the default
# package list from vars/[OS-family].yml will be used.
# mysql_packages:
#   - mysql
#   - mysql-server
#   - MySQL-python

mysql_python_package_debian: python3-mysqldb

# MySQL connection settings.
mysql_port: "3306"
mysql_bind_address: '0.0.0.0'
mysql_skip_name_resolve: false
mysql_datadir: /var/lib/mysql
mysql_sql_mode: ~
# The following variables have a default value depending on operating system.
# mysql_pid_file: /var/run/mysqld/mysqld.pid
# mysql_socket: /var/lib/mysql/mysql.sock

# Log file settings.
mysql_log_file_group: mysql

# Slow query log settings.
mysql_slow_query_log_enabled: false
mysql_slow_query_time: "2"
# The following variable has a default value depending on operating system.
# mysql_slow_query_log_file: /var/log/mysql-slow.log

# Memory settings (default values optimized ~512MB RAM).
mysql_key_buffer_size: "256M"
mysql_max_allowed_packet: "64M"
mysql_table_open_cache: "256"
mysql_sort_buffer_size: "1M"
mysql_read_buffer_size: "1M"
mysql_read_rnd_buffer_size: "4M"
mysql_myisam_sort_buffer_size: "64M"
mysql_thread_cache_size: "8"

# Query caching not available on Mysql version ≥ 8.0
# On MariaDB, behavior changed on version ≥ 10.1.7:
# * even if query cache usage (`query_cache_type`) is configured, it depends on the configured cache size
#   (`query_cache_size`), cf. https://mariadb.com/kb/en/server-system-variables/#query_cache_type:
#   * if you set size to 0, query caching is disabled
#   * if you set size to non-zero, query caching is enabled
# * we are unsure of `query_cache_type = 2/DEMAND` behavior
# * `query_cache_size` and `query_cache_limit` can still be configured and have the same semantics and default values as
#   their previous MySQL counterparts
mysql_query_cache_type: "0"
mysql_query_cache_size: "16M"
mysql_query_cache_limit: "1M"

mysql_max_connections: "151"
mysql_tmp_table_size: "16M"
mysql_max_heap_table_size: "16M"
mysql_group_concat_max_len: "1024"
mysql_join_buffer_size: "262144"

# Other settings.
mysql_lower_case_table_names: "0"
mysql_wait_timeout: "28800"
mysql_event_scheduler_state: "OFF"

# InnoDB settings.
mysql_innodb_file_per_table: "1"
# Set .._buffer_pool_size up to 80% of RAM but beware of setting too high.
mysql_innodb_buffer_pool_size: "256M"
# Set .._log_file_size to 25% of buffer pool size.
mysql_innodb_log_file_size: "64M"
mysql_innodb_log_buffer_size: "8M"
mysql_innodb_flush_log_at_trx_commit: "1"
mysql_innodb_lock_wait_timeout: "50"

# These settings require MySQL > 5.5.
mysql_innodb_large_prefix: "1"
mysql_innodb_file_format: "barracuda"

# mysqldump settings.
mysql_mysqldump_max_allowed_packet: "64M"

# Logging settings.
mysql_log: ""
# The following variables have a default value depending on operating system.
# mysql_log_error: /var/log/mysql/mysql.err
# mysql_syslog_tag: mysql

mysql_config_include_files: []
#  - src: path/relative/to/playbook/file.cnf
#  - src: path/relative/to/playbook/anotherfile.cnf.j2
#    type: template
#    dest_dir: mariadb.conf.d
#    dest_name: 90-anotherfile.cnf
#    force: true
#  - src: path/relative/to/playbook/static.cnf
#    type: file
#    dest_dir: conf.d

# Include files to DELETE (same dest_dir / dest_name as above). The role never deletes a file by
# itself: this is how a project retires a file it used to deploy (now a role include or a variable)
# or an unmanaged leftover that would duplicate an option. Shown by --check --diff, notifies
# the restart. A file that is also deployed is refused.
mysql_config_include_files_absent: []
#  - dest_name: custom-local.cnf
#    dest_dir: conf.d
#  - dest_name: 90-old.cnf
#    dest_dir: mariadb.conf.d

# Include files of the official MariaDB package (Debian only), driven by variables.
# false (default): the role deploys only mysql_config_include_files. Nothing changes.
# true: the role also deploys, in mariadb.conf.d, the include files of the MariaDB
#   package rendered from templates/mariadb_includes/<set>/. Each commented option of
#   the package file is uncommented, with the value of its variable, ONLY when the
#   project sets that variable (host_vars, group_vars, -e). Role defaults are ignored,
#   so a file without any variable is byte-identical to the one of the package.
#   A role-owned 70-cytadel-extra.cnf carries what the package files do not offer.
#   Active package options (bind-address, pid-file, expire_logs_days...) are driven in 50-server.cnf.
#   mysql_config_include_files is merged afterwards: the project entry wins on the same
#   destination, and 90-*.cnf files keep the last word (alphabetical order).
#   Needs my.cnf linked to mariadb.cnf, or left untouched (see my.cnf decision tree).
#   These files are dpkg conffiles: a package upgrade keeps the role version and writes
#   the new package one as *.dpkg-dist (apt --force-confold, or answer N).
mysql_mariadb_includes_manage: false

# Template set: '10.11' (MariaDB < 11.6, Debian 12) or '11.8' (>= 11.6, Debian 13).
# 11.6 is where MariaDB switched its default charset to utf8mb4.
mysql_mariadb_includes_version: "{{ '11.8' if (mysql_cli_version | regex_search('^[0-9]+[.][0-9]+') is version('11.6', '>=')) else '10.11' }}"

# Package include files to leave alone, by filename (e.g. ['60-galera.cnf']).
mysql_mariadb_includes_exclude: []

# Variables read by the package include templates (option -> variable).
# Same names as my.cnf.j2 where the option exists there; otherwise mysql_<option>.
#   50-server.cnf   mysql_daemon_user mysql_datadir mysql_tmpdir mysql_skip_name_resolve (bool)
#                   mysql_key_buffer_size mysql_max_allowed_packet mysql_thread_stack
#                   mysql_thread_cache_size mysql_myisam_recover_options mysql_max_connections
#                   mysql_table_open_cache (table_cache is its deprecated alias)
#                   mysql_log (general_log + general_log_file) mysql_log_error
#                   mysql_general_log_file (general_log_file alone, general_log stays off;
#                   wins over mysql_log for the file name)
#                   mysql_slow_query_log_file mysql_slow_query_time mysql_slow_query_log_verbosity
#                   mysql_slow_query_log_enabled (bool, writes slow_query_log 1 or 0)
#                   mysql_log_queries_not_using_indexes (bool) mysql_log_slow_min_examined_row_limit
#                   mysql_server_id mysql_log_bin mysql_max_binlog_size
#                   mysql_ssl_ca mysql_ssl_cert mysql_ssl_key mysql_require_secure_transport
#                   mysql_innodb_buffer_pool_size
#   50-client.cnf   mysql_client_ssl_cert mysql_client_ssl_key mysql_client_ssl_verify_server_cert
#   60-galera.cnf   mysql_wsrep_on mysql_wsrep_cluster_name mysql_wsrep_cluster_address
#                   mysql_wsrep_slave_threads mysql_galera_binlog_format
#                   mysql_galera_default_storage_engine mysql_galera_innodb_autoinc_lock_mode
#                   mysql_galera_bind_address mysql_galera_innodb_flush_log_at_trx_commit
#   70-cytadel-extra.cnf (see the file) mysql_port mysql_sql_mode mysql_ignore_db_dirs (string or list)
#                   mysql_disable_log_bin (bool, skip-log-bin) mysql_table_definition_cache
#                   mysql_innodb_stats_on_metadata
#                   and the memory / InnoDB settings of my.cnf.j2
#   80-cytadel-monitoring.cnf (only deployed when one of them is set; list in vars/main.yml)
#                   mysql_performance_schema_enabled (bool) mysql_performance_schema_instrument (string or list)
#                   mysql_performance_schema_consumer_statements_digest (bool)
#                   mysql_innodb_monitor_enable mysql_log_slow_rate_limit
#                   Binary log, the whole set (mysql_log_bin itself is written by 50-server.cnf):
#                     mysql_log_bin (log_bin, 50-server)  mysql_log_bin_index (log-bin-index)
#                     mysql_binlog_format  mysql_binlog_expire_logs_seconds
#                     mysql_max_binlog_size (50-server)
# A variable that is not set by the project, or set to an empty value, leaves the package line as is.

# systemd drop-in: ONE file that carries the service limits (LimitNOFILE, OOMScoreAdjust).
# Off by default: nothing is written and nothing changes for existing projects.
# Same variable names as the former cytadel_mysql role (mysql_systemd_open_file_limit...).
#   mysql_systemd_dropin_manage   write the drop-in (tasks/systemd-dropin.yml)
#   mysql_systemd_dropin_name     file name. Default override.conf: the name `systemctl edit` writes,
#                                 so `systemctl cat` shows our header, and a hand edit is either
#                                 reverted by the next run or caught by the verify step.
#   mysql_systemd_dropin_purge    remove every other file of the drop-in directory (one drop-in only):
#                                 systemd reads only *.conf, the rest are leftovers (.bak, .dpkg-old)
#   mysql_systemd_dropin_keep     file names the purge leaves alone: the one that the Debian package
#                                 creates (empty) must not fight with the package
#   mysql_systemd_dropin_verify   ask systemd what it really loaded and fail if it differs from the
#                                 variables or if a foreign drop-in is still there (purge on)
#   mysql_systemd_dropin_restart  restart the service when the drop-in changes. Off: a limit only
#                                 applies to the process at its next restart, never restart a
#                                 production database as a side effect.
# A value set to '' leaves the directive out of the file.
mysql_systemd_dropin_manage: false
mysql_systemd_dropin_name: override.conf
mysql_systemd_dropin_dir: "/etc/systemd/system/{{ mysql_daemon }}.service.d"
mysql_systemd_open_file_limit: "153600"
mysql_systemd_oom_score_adjust: "-600"
mysql_systemd_dropin_purge: false
mysql_systemd_dropin_keep:
  - migrated-from-my.cnf-settings.conf
mysql_systemd_dropin_verify: true
mysql_systemd_dropin_restart: false

# Databases.
mysql_databases: []
#   - name: example
#     collation: utf8_general_ci
#     encoding: utf8
#     replicate: 1

# Users.
mysql_users: []
#   - name: example
#     host: 127.0.0.1
#     password: secret
#     priv: *.*:USAGE
#   - name: example_socket
#     host: localhost
#     plugin: unix_socket
#     plugin_hash_string: monitoring
#     priv: *.*:USAGE

mysql_disable_log_bin: false

# Replication settings (replication is only enabled if master/user have values).
mysql_server_id: "1"
mysql_max_binlog_size: "100M"
mysql_binlog_format: "ROW"
mysql_expire_logs_days: "10"
mysql_replication_role: ''
mysql_replication_master: ''
mysql_replication_master_inventory_host: "{{ mysql_replication_master }}"

# Same keys as `mysql_users` above.
mysql_replication_user: []

mysql_hide_passwords: false
